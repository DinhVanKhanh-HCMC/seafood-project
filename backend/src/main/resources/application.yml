
server:
  port: 8080

spring:
  application:
    name: SeafoodApplication

  data:
    mongodb:
      uri: ${URI_MONGO}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      username: default
      ssl:
        enabled: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_VERIFY}
    password: ${EMAIL_VERIFY_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY_ID}
    secret-key: ${AWS_S3_SECRET_ACCESS_KEY}